- name: Install packages
  hosts: local
  connection: local
  tasks:
  - name: install package
    ansible.builtin.package:
      name: "{{name.item}}"
      state: "{{state.item}}"
    loop:
    - { name: "mysql", state: "absent" }
    - { name: "nginx", state: "present" }
    - { name: "zip", state: "present" }
