- name : demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform

    tagsMap:
      name: ansible
      project: roboshop
      component: catalogue

  tasks:
  - name : greeting
    ansible.builtin.debug:
      msg: "Hi Sivaram, {{GEETING | default('Good morning')}}"

  - name : convert string to list
    ansible.builtin.debug:
      msg: "{{topics | split(',')}}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tagsMap | dict2items }}"